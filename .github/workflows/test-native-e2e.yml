name: Native E2E (Maestro)

# Separate from the main Tests workflow on purpose: this job boots an Android emulator and
# runs a Gradle build, so it costs minutes rather than seconds. It runs only when the diff
# touches the camera/scan surface it covers — the same condition the agentic dev team's
# reviewer applies (agent-team/src/prompts/guardrails.md, "Native E2E") — plus on demand.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bread-sheet-app/app/(tabs)/scan.tsx'
      - 'bread-sheet-app/components/manual-barcode-sheet.tsx'
      - 'bread-sheet-app/features/products/barcode.ts'
      - 'bread-sheet-app/e2e/maestro/**'
      - 'bread-sheet-app/scripts/test-maestro.js'
      - '.github/workflows/test-native-e2e.yml'

permissions:
  contents: read

# An emulator run costs minutes; a rapid second push should supersede the first rather than
# race it. Never cancel on main, where a completed run is what populates the caches below for
# every branch cut from it.
concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  maestro:
    name: Camera & scan flows on an Android emulator
    # Nested virtualisation for the emulator needs a Linux runner with KVM.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bread-sheet-app

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bread-sheet-app/package-lock.json

      # A JDK in the 17-21 range: the Android Gradle Plugin's JdkImageTransform runs the JDK's
      # own jlink and fails on anything newer, and JDK 24+ additionally breaks the CMake
      # configure tasks via its restricted-native-access rules. scripts/test-maestro.js
      # enforces the same bound and would reject a newer runner default outright.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The emulator package and system image are ~1 GB and the Gradle cache does not cover
      # them, so without this every run re-downloads them. Keyed on the image coordinates: a
      # different API or flavour must miss, since booting the wrong image is exactly the
      # failure this suite hit during development (Play-Store images hang Maestro's inputText).
      # ~/.android/avd rides along so the AVD survives too; the runner wipes app data after
      # install and both flows launch with clearState, so inherited userdata cannot leak in.
      - name: Cache Android emulator, system image and AVD
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/system-images/android-35/google_apis/x86_64
            ~/.android/avd
          key: android-emu-${{ runner.os }}-api35-google_apis-x86_64-v1

      # ubuntu-24.04 ships the SDK, cmdline-tools and platform-tools but NOT the emulator,
      # and no system image — so scripts/test-maestro.js correctly refuses to start. Install
      # the two packages it needs; it provisions the AVD itself from there. `yes |` covers the
      # licence prompts, and sdkmanager writes progress to stdout unconditionally, hence the
      # filtering — a full progress dump is thousands of lines of carriage returns.
      - name: Install Android emulator and system image
        run: |
          set -o pipefail
          IMAGE_DIR="$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
          # Checked on disk rather than on the cache step's hit/miss output: a partial restore
          # should re-download, and scripts/test-maestro.js scans this directory directly, so
          # what matters is whether the files are here — not whether a cache key matched.
          if [ -x "$ANDROID_HOME/emulator/emulator" ] && [ -d "$IMAGE_DIR" ]; then
            echo "emulator and system image restored from cache — skipping download"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            test -x "$SDKMANAGER" || { echo "sdkmanager not found at $SDKMANAGER"; exit 1; }
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" \
              | grep -viE '^\[=*>? *\]|^$' || true
          fi
          test -x "$ANDROID_HOME/emulator/emulator" || { echo "emulator still missing"; exit 1; }
          test -d "$IMAGE_DIR" || { echo "system image still missing at $IMAGE_DIR"; exit 1; }
          echo "emulator: $("$ANDROID_HOME/emulator/emulator" -version | head -1)"

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bread-sheet-app/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # The runner provisions its own AVD when cmdline-tools are present, which they are on
      # this image. Supabase config comes from repo *variables*, not secrets: both are
      # EXPO_PUBLIC_* values Expo bakes into the client bundle, so they are already public —
      # the same reasoning as the Playwright job in test.yml.
      - name: Run Maestro flows
        run: npm run test:maestro
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

      # Screenshots and per-step view hierarchies live in Maestro's own run directory, not in
      # the repo — the hierarchy JSON is what distinguishes "view was off-screen" from "wrong
      # testID", which is exactly the failure this suite hit during development.
      - name: Upload Maestro artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: |
            ~/.maestro/tests/
            bread-sheet-app/e2e/maestro/artifacts/
          retention-days: 14
